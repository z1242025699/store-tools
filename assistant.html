// ================= 基础工具 =================
function $(id){return document.getElementById(id)}
function pad2(n){return n<10?"0"+n:""+n}
function norm(s){
  return String(s||"")
    .replace(/[\uFF01-\uFF5E]/g,function(c){return String.fromCharCode(c.charCodeAt(0)-0xFEE0)})
    .replace(/[\u3000\s]+/g,"")
    .replace(/[，。！？、；：“”‘’（）《》【】…—～·]/g,"")
    .toLowerCase();
}
function esc(s){return String(s).replace(/[&<>"]/g,function(c){return {"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]})}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x}
function daysBetween(a,b){var ms=new Date(b.getFullYear(),b.getMonth(),b.getDate())-new Date(a.getFullYear(),a.getMonth(),a.getDate());return Math.round(ms/86400000)}
function fmt(d){return d.getFullYear()+"-"+pad2(d.getMonth()+1)+"-"+pad2(d.getDate())}
function today(){var n=new Date();return new Date(n.getFullYear(),n.getMonth(),n.getDate())}

// ================= 商品索引 =================
var BYNO={}, BYLONG={};
DATA.forEach(function(x){BYNO[x.no]=x;if(x.long)BYLONG[String(x.long)]=x;});

function findGoods(q){
  var out=[],i;
  var m=q.match(/\d{5,12}/g);
  if(m){
    for(i=0;i<m.length;i++){
      var k=m[i];
      if(BYNO[k]){out.push(BYNO[k]);continue;}
      if(BYLONG[k]){out.push(BYLONG[k]);continue;}
      // 长编码去掉前两位 64/98 再试
      var k2=k.replace(/^(64|98)/,"");
      if(BYNO[k2]) out.push(BYNO[k2]);
    }
    if(out.length) return out;
  }
  var keys=Object.keys(ALIAS);
  for(i=0;i<keys.length;i++){
    if(q.indexOf(norm(keys[i]))>=0){
      for(var j=0;j<ALIAS[keys[i]].length;j++){
        var g=BYNO[ALIAS[keys[i]][j]];
        if(g&&out.indexOf(g)<0) out.push(g);
      }
    }
  }
  if(out.length) return out;
  var qq=q.replace(/^(查|找|看看|有没有|这个|那个)+/,"");
  if(qq.length>=2){
    for(i=0;i<DATA.length;i++){
      if(norm(DATA[i].name).indexOf(qq)>=0) out.push(DATA[i]);
    }
  }
  return out;
}

// ================= 档位 =================
function bandOf(d){
  if(d<=2) return {band:"1-2天",check:"1次/天",pre:null,off:0};
  if(d<=5) return {band:"3-5天",check:"1次/天",pre:null,off:1};
  if(d<=10) return {band:"6-10天",check:"1次/天",pre:null,off:2};
  if(d<=14) return {band:"11-14天",check:"1次/天",pre:null,off:3};
  if(d<=29) return {band:"15-29天",check:"1次/天",pre:null,off:5};
  if(d<=89) return {band:"30-89天",check:"1次/周",pre:10,off:8};
  if(d<=364) return {band:"90天-1年以下",check:"1次/2周",pre:30,off:15};
  return {band:"1年（含）以上",check:"1次/月",pre:90,off:30};
}

// ================= 抽取 =================
function extractDays(q){
  var s=q.replace(/\d{4}年\d{1,2}月\d{1,2}[日号]?/g,"")
           .replace(/\d{1,2}月\d{1,2}[日号]?/g,"")
           .replace(/\d{1,2}[\/\.\-]\d{1,2}/g,"");
  var m=s.match(/(\d+(?:\.\d+)?)\s*(天|日|个月|月|年)/);
  if(!m) return null;
  var n=parseFloat(m[1]);
  if(m[2]==="年") return Math.round(n*365);
  if(m[2]==="个月"||m[2]==="月") return Math.round(n*30);
  return Math.round(n);
}
function extractDate(q){
  var t=today();
  if(/今天/.test(q)) return t;
  if(/昨天/.test(q)) return addDays(t,-1);
  if(/前天/.test(q)) return addDays(t,-2);
  if(/明天/.test(q)) return addDays(t,1);
  var m=q.match(/(?:(\d{4})[年\/\-\.])?(\d{1,2})[月\/\-\.](\d{1,2})[日号]?/);
  if(!m) return null;
  var y=m[1]?parseInt(m[1],10):t.getFullYear();
  var mo=parseInt(m[2],10), d=parseInt(m[3],10);
  if(mo<1||mo>12||d<1||d>31) return null;
  var dt=new Date(y,mo-1,d);
  if(dt.getMonth()!==mo-1) return null;
  return dt;
}

// ================= 公式 =================
function calcDates(days,start){
  var b=bandOf(days);
  var exp=addDays(start,days-1);
  var offDay=addDays(exp,-b.off);
  var preDay=(b.pre===null)?null:addDays(exp,-b.pre);
  var t=today(), left=daysBetween(t,offDay);
  var s="";
  s+="生产/到货：" + fmt(start) + "\n";
  s+="保质期：" + days + " 天（" + b.band + " 档，检查 " + b.check + "）\n";
  s+="到期日：" + fmt(exp) + "（= " + fmt(start) + " + " + days + " − 1）\n";
  if(preDay) s+="转临期日：" + fmt(preDay) + "（到期前 " + b.pre + " 天）\n";
  else s+="转临期日：" + "无。1-29 天不设临期，直接按下架日处理\n";
  s+="下架日：" + fmt(offDay) + "（" + (b.off===0?"届满当天":"到期前 "+b.off+" 天") + "）\n";
  s+="\n距下架：" + (left<0 ? ("已超 "+(-left)+" 天，按报损流程处理") : (left+" 天"));
  return s;
}

function matchFAQ(q){
  var best=null, bs=0;
  for(var i=0;i<FAQ.length;i++){
    var f=FAQ[i], sc=0;
    for(var j=0;j<f.m.length;j++){
      if(q.indexOf(norm(f.m[j]))>=0) sc+=f.m[j].length*2;
    }
    if(sc>bs){bs=sc;best=f;}
  }
  return bs>=4?best:null;
}

var RULEWORD=/(还能卖|几天|多久|下架|临期|保质期|温度|几度|多少度|冷藏|冷冻|怎么|为什么|能不能|可以吗|打折|几折|开封|报损|成本|进价|毛利|供应商|投诉|退款|库存|盘|分几档|档位|预警)/;

function goodsList(list,limit){
  var s="",n=Math.min(list.length,limit||12);
  for(var i=0;i<n;i++){
    var x=list[i];
    s+="\n· " + x.name + (x.spec?("（"+x.spec+"）"):"")
      +"\n  号 " + x.no + "｜分区 " + (x.zone||"—")
      +"｜保质期 " + (x.days?(x.days+" 天"):"未录")
      +"｜售价 " + (x.price?("￥"+x.price):"—");
  }
  if(list.length>n) s+="\n……还有 " + (list.length-n) + " 个，说细一点我再筛";
  return s;
}

function zoneAnswer(z, onlyCount){
  var list=DATA.filter(function(x){return x.zone===z;});
  var done=list.filter(function(x){return x.days;});
  var s=z+" 分区：一共 "+list.length+" 个商品，已录保质期 "+done.length+" 个，未录 "+(list.length-done.length)+" 个。";
  if(onlyCount) return {t:s+"\n\n要清单就说「列出 "+z+" 区商品」。",src:"商品主数据 · 实时统计"};
  var sl=list.slice().sort(function(a,b){return (a.days||99999)-(b.days||99999);});
  s+="\n（按保质期从短到长）";
  s+=goodsList(sl,15);
  return {t:s,src:"商品主数据 · 按保质期升序"};
}

function answer(raw){
  var q=norm(raw);
  if(!q) return {t:"说点什么吧。",src:""};

  var days=extractDays(q);
  var day=extractDate(q);

  // 0a. 分区盘点
  var zm=q.match(/(42|44|89)(?:区|库|分区)/);
  if(zm && /(多少|几个|哪些|列出|清单|录了|统计)/.test(q)){
    return zoneAnswer(zm[1], /(多少|几个|录了|统计)/.test(q) && !/(哪些|列出|清单)/.test(q));
  }

  // 0b. 两个天数比档位
  var cmp=q.match(/(\d+)\s*天[^。]*?(\d+)\s*天/);
  if(cmp && /(一样|同档|相同|是不是)/.test(q)){
    var A=parseInt(cmp[1],10), B=parseInt(cmp[2],10), ba=bandOf(A), bb=bandOf(B);
    return {t:(ba.band===bb.band ? (A+" 天和 "+B+" 天都归「"+ba.band+"」档，规则完全一样。") : (A+" 天归「"+ba.band+"」档，"+B+" 天归「"+bb.band+"」档，不一样。")),src:"临保规则 · 档位边界"};
  }

  // 0c. 0 天 / 空值
  if(days!==null && days<1){
    return {t:"0 天、或者空着，不代表永远不过期。\n空的是「未录入」，按包装标示或问主管。\n工具不把空值当无限期。",src:"话术 · 边界"};
  }

  // 1. 日期 + 天数 → 直接算
  if(days!==null && day){
    return {t:calcDates(days,day),src:"日期算法 · 到期日=生产日+保质期−1"};
  }

  // 2. 温度 / 断链
  if(/温度|几度|多少度|零下|度c|℃|-22|-18|断链/.test(q)){
    var isIce=/冰淇淋|冰柜|雪糕/.test(q);
    var tm=q.match(/-(\d+)/), extra="";
    if(tm){
      var deg=-parseInt(tm[1],10);
      if(deg!==-22 && deg!==-18 && isIce){
        extra=(deg>-22)
          ? ("\n\n你报的是 "+deg+"℃，高于 -22℃，已经超标——立即报主管判断是否断链，货先隔离，不要自行放回货架，不要自行打折。")
          : ("\n\n"+deg+"℃ 在 -22℃ 线以下，正常。");
      }else if(deg!==-22 && deg!==-18 && deg>-18){
        extra="\n\n"+deg+"℃ 高于普通冷冻 -18℃ 线，报主管。如果是冰淇淋，标准是 -22℃，更严。";
      }
    }
    var base = isIce
      ? (extra
          ? "冰淇淋储存温度必须 ≤ -22℃（普通冷冻 -18℃，两条线别混）。"
          : "冰淇淋储存温度必须 ≤ -22℃。\n普通冷冻品是 -18℃，两条线别混。\n\n库温高于 -22℃ 要立即报主管，由主管判断是否断链、是否隔离。\n温度异常过的冰淇淋：不要自行放回货架，不要自行打折。")
      : "温度只有两条线：\n普通冷冻品 -18℃\n冰淇淋 -22℃（更严）\n\n报一下现在几度、是哪个柜，我帮你判断。";
    return {t:base+extra,src:"临保规则 · 冰淇淋温度硬线"};
  }

  // 2b. 问温区 → 不要给商品列表
  if(/(冷藏还是冷冻|放冷藏|放冷冻|哪个温区|哪个库|温区)/.test(q)){
    var fz=matchFAQ(q);
    if(fz) return {t:fz.a,src:fz.src};
  }

  // 3. 纯商品号
  var gm=q.match(/\d{5,12}/);
  if(gm){
    var g=findGoods(q);
    if(g.length) return goodsAnswer(g,q,days,day);
    return {t:"表里没有这个商品号。我不编，你核对一下号码，或者报商品名。",src:"商品主数据"};
  }

  // 4. 商品名
  var goods=findGoods(q);
  if(goods.length) return goodsAnswer(goods,q,days,day);

  // 5. 只给了天数 → 档位（若问「有哪些」先列商品）
  if(days!==null){
    if(/(哪些|有哪|列出|清单|商品)/.test(q)){
      var same=DATA.filter(function(x){return parseInt(x.days,10)===days;});
      if(same.length){
        return {t:"保质期正好 "+days+" 天的有 "+same.length+" 个："+goodsList(same,15)+"\n\n"+bandText(days),src:"商品主数据 + 临保规则"};
      }
    }
    return {t:bandText(days),src:"临保规则 · 一"};
  }

  // 6. 规则问答
  var hit=matchFAQ(q);
  if(hit) return {t:hit.a,src:hit.src};

  // 7. 兜底
  return {t:"这个我没把握，不乱答。\n我只管鲜食冻品的商品信息、临保规则、品类常识和话术口径。超出范围的，建议问主管。\n\n你可以换个说法，比如报个商品号、报「日期 + 保质期」，或者问档位规则。",src:""};
}

function bandText(d){
  var b=bandOf(d);
  var s="保质期 " + d + " 天，归「" + b.band + "」档：\n";
  s+="检查频率：" + b.check + "\n";
  s+="转临期：" + (b.pre===null?"无（1-29 天不设临期，届满当天直接处理）":("到期前 " + b.pre + " 天")) + "\n";
  s+="下架：" + (b.off===0?"届满当天":("到期前 " + b.off + " 天"));
  s+="\n\n报一个生产/到货日期，我把具体日子算给你。";
  return s;
}

function goodsAnswer(list,q,days,day){
  if(list.length===1 && day && list[0].days){
    var d0=parseInt(list[0].days,10);
    return {t:"· "+list[0].name+"（号 "+list[0].no+"，保质期 "+list[0].days+" 天）\n\n"+calcDates(d0,day),src:"商品主数据 + 日期算法"};
  }
  if(days!==null && list.length===1){
    return {t:"查到一款：" + list[0].name + "\n保质期 " + list[0].days + " 天。\n\n" + bandText(days),src:"商品主数据 + 临保规则"};
  }
  var s="";
  if(list.length===1){
    var x=list[0];
    s+="查到 1 个：\n· " + x.name + (x.spec?("（"+x.spec+"）"):"") + "\n";
    s+="商品号 " + x.no + (x.long&&x.long!==x.no?("（长编码 "+x.long+"）"):"") + "\n";
    s+="分区 " + (x.zone||"—") + "｜售价 " + (x.price?("￥"+x.price):"—") + "\n";
    if(x.days){
      var b=bandOf(parseInt(x.days,10));
      s+="保质期 " + x.days + " 天（" + (x.band||b.band) + " 档，检查 " + (x.check||b.check) + "）\n";
      s+="转临期 " + (b.pre===null?"无":("到期前 "+b.pre+" 天")) + "｜下架 " + (b.off===0?"届满当天":("到期前 "+b.off+" 天"));
      s+="\n\n直接说一个生产/到货日期（比如 11月1日），我把日子算给你。";
    }else{
      s+="保质期：表里未录。\n按包装标示或问主管，工具不猜天数。";
    }
    return {t:s,src:"商品主数据"};
  }
  s="找到 " + list.length + " 个，说具体一点我可以再筛：";
  s+=goodsList(list,10);
  if(list.length>1) s+="\n\n报商品号，或者补一两个特征（品牌、规格、口味）。";
  return {t:s,src:"商品主数据"};
}

var msgs=$("msgs"), quick=$("quick");

function push(role,obj){
  var d=document.createElement("div");
  d.className="msg "+(role==="me"?"me":"bot");
  var b=document.createElement("div");
  b.className="bub";
  b.textContent=obj.t||"";
  if(obj.src){
    var sp=document.createElement("span");
    sp.className="src";
    sp.textContent="依据：" + obj.src;
    b.appendChild(sp);
  }
  d.appendChild(b);
  msgs.appendChild(d);
  msgs.scrollTop=msgs.scrollHeight;
}

function ask(text){
  if(!text||!text.trim()) return;
  push("me",{t:text});
  $("in").value="";
  setTimeout(function(){ push("bot",answer(text)); },90);
}

var QUICK=["保质期45天什么时候下架","冰淇淋柜-20℃能卖吗","分几档","42区查什么","报损单能批吗","你能干什么"];
QUICK.forEach(function(q){
  var b=document.createElement("button");
  b.className="qb";
  b.type="button";
  b.textContent=q;
  b.onclick=function(){ask(q)};
  quick.appendChild(b);
});

$("go").onclick=function(){ask($("in").value)};
$("in").addEventListener("keydown",function(e){
  if(e.key==="Enter"){e.preventDefault();ask(this.value);}
});
