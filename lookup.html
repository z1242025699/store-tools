.clr{position:absolute;right:5px;top:4px;width:44px;height:44px;border:0;background:transparent;font-size:20px;color:#8a94a3;line-height:1;border-radius:22px;display:none;cursor:pointer}
.clr.show{display:block}
.clr:active{background:#eef1f5}
input[type=date]{width:100%;height:52px;padding:0 12px;font-size:16px;border:1.5px solid #cdd4dd;border-radius:12px;background:#fff;color:var(--fg)}
input[type=date]:focus{outline:none;border-color:var(--blue);box-shadow:0 0 0 3px rgba(31,95,168,.15)}
.hint{font-size:15px;color:var(--muted);margin-top:8px}
#list{margin-top:4px}
.count{font-size:15px;color:var(--muted);margin:2px 0 6px}
.item{display:block;padding:14px 10px;margin:0 -4px;border-radius:12px;border-bottom:1px solid var(--line);cursor:pointer;min-height:60px}
.item:last-child{border-bottom:0}
.item:active{background:#eaf1fa}
.nm{font-size:17px;font-weight:600;line-height:1.45;word-break:break-word}
.meta{font-size:15px;color:var(--muted);margin-top:3px;word-break:break-word}
.zone{display:inline-block;font-size:14px;padding:2px 9px;border-radius:999px;background:#eaf1f9;color:#2b4a70;margin-left:6px;vertical-align:1px}
.empty{color:var(--muted);font-size:15px;padding:14px 4px;line-height:1.7}
.back{display:block;width:100%;height:46px;font-size:16px;font-weight:600;color:var(--blue);background:#eef4fb;border:0;border-radius:12px;margin:0 0 14px;cursor:pointer;text-align:center}
.back:active{background:#dce8f6}
.dname{font-size:19px;font-weight:700;line-height:1.4;word-break:break-word}
.dmeta{font-size:15px;color:var(--muted);margin-top:4px;word-break:break-word}
.dates{list-style:none;padding:0;margin:12px 0 0}
.dates li{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:12px 0;border-bottom:1px dashed var(--line);font-size:16px}
.dates li:last-child{border-bottom:0}
.dates .k{color:var(--muted);font-size:15px;flex:0 0 auto}
.dates .v{font-weight:700;font-variant-numeric:tabular-nums;text-align:right;word-break:break-word}
.dates .v small{font-weight:400;color:var(--muted);font-size:14px;margin-left:4px}
.status{display:inline-block;padding:6px 14px;border-radius:999px;font-size:15px;font-weight:700;color:#fff;margin:12px 0 2px}
.s-red{background:var(--red)}.s-orange{background:var(--orange)}.s-green{background:var(--green)}.s-gray{background:#8b949e}
.msg{font-size:15px;color:var(--muted);margin-top:8px}
.rule{font-size:15px;color:var(--muted);line-height:1.75}
.rule b{color:var(--fg)}
.rule .alg{display:block;margin-top:8px;padding-top:8px;border-top:1px solid var(--line)}
.warn{background:#fff4e5;border:1px solid #ffd9a0;border-radius:10px;padding:11px 12px;font-size:15px;color:#7a4a00;margin-top:10px}
</style>

var HINT = {"980491623":"这是面点/烘焙，不是鲜奶"};
function bandOf(d){
  if(!d || d<1) return null;
  if(d<=2)   return {band:"1-2天",   check:"1次/天", pre:null, off:0};
  if(d<=5)   return {band:"3-5天",   check:"1次/天", pre:null, off:1};
  if(d<=10)  return {band:"6-10天",  check:"1次/天", pre:null, off:2};
  if(d<=14)  return {band:"11-14天", check:"1次/天", pre:null, off:3};
  if(d<=29)  return {band:"15-29天", check:"1次/天", pre:null, off:5};
  if(d<=89)  return {band:"30-89天", check:"1次/周", pre:10, off:8};
  if(d<=364) return {band:"90天-1年以下", check:"1次/2周", pre:30, off:15};
  return              {band:"1年（含）以上", check:"1次/月", pre:90, off:30};
}

function pad(n){return n<10?"0"+n:""+n;}
function fmt(d){return d.getFullYear()+"-"+pad(d.getMonth()+1)+"-"+pad(d.getDate());}
function parseDate(s){var p=s.split("-");return new Date(+p[0],+p[1]-1,+p[2]);}
function addDays(d,n){var x=new Date(d.getTime());x.setDate(x.getDate()+n);return x;}
function daysBetween(a,b){return Math.round((b-a)/86400000);}
function today(){var t=new Date();return new Date(t.getFullYear(),t.getMonth(),t.getDate());}

var $=function(id){return document.getElementById(id);};
var cur=null;

// ---------- 搜索 ----------
function norm(s){return (s||"").toLowerCase().replace(/\s+/g,"");}

function search(q){
  q=norm(q);
  if(!q) return [];
  // 库区：42 / 44 / 89（支持「42区」「分区44」写法）
  var zm=q.match(/^(?:分区|库区)?(42|44|89)(?:区)?$/);
  if(zm){ return DATA.filter(function(x){return x.zone===zm[1];}); }
  // 纯数字：优先按商品号/长编码
  if(/^\d+$/.test(q)){
    var r1=DATA.filter(function(x){return x.no===q||x.long===q;});
    if(r1.length) return r1;
    return DATA.filter(function(x){return x.no.indexOf(q)===0||x.long.indexOf(q)===0||x.no.indexOf(q)>=0||x.long.indexOf(q)>=0;});
  }
  var out=[], seen={};
  function push(x,score){
    // 带「提示」的商品（如面点里的"鲜牛奶馒头"）压低排序，不能混进同类候选前面
    if(HINT[x.no]) score+=20;
    if(seen[x.no]) { if(score<seen[x.no].s) seen[x.no].s=score; return; }
    seen[x.no]={x:x,s:score}; out.push(seen[x.no]);
  }
  // 1. 叫法表命中：把该叫法下的所有商品拉出来
  Object.keys(ALIAS).forEach(function(w){
    var wn=norm(w);
    if(q.indexOf(wn)>=0 || wn.indexOf(q)>=0){
      ALIAS[w].forEach(function(no){
        DATA.forEach(function(x){ if(x.no===no) push(x, 1); });
      });
    }
  });
  // 2. 商品名直接命中
  DATA.forEach(function(x){
    var n=norm(x.name);
    if(n===q) push(x,0);
    else if(n.indexOf(q)>=0) push(x,2);
  });
  out.sort(function(a,b){ return a.s-b.s; });
  return out.map(function(o){return o.x;});
}

function render(q){
  var res=search(q);
  var box=$("list");
  if(!norm(q)){ box.innerHTML=""; return; }
  if(!res.length){
    box.innerHTML='<div class="empty">表里没有跟「'+esc(q)+'」对得上的商品。<br>换个说法：报商品号，或报名字里更靠前的几个字。</div>';
    return;
  }
  var html="";
  res.slice(0,30).forEach(function(x,i){
    var h=HINT[x.no];
    html+='<div class="item" data-i="'+i+'">'
      +'<div class="nm">'+esc(x.name)
      +'<span class="zone">'+(x.zone?("分区 "+x.zone):"分区未录")+'</span></div>'
      +'<div class="meta">商品号 '+esc(x.no)
      +(x.spec?(" · 规格 "+esc(x.spec)):"")
      +(x.price?(" · ￥"+esc(x.price)):"")
      +(x.days?(" · 保质期 "+esc(x.days)+" 天"):' · 保质期 <b style="color:#e07b00">表里未录</b>')
      +'</div>'
      +(h?'<div class="meta" style="color:#b45309">⚠ '+esc(h)+'</div>':'')
      +'</div>';
  });
  if(res.length>30) html+='<div class="empty">结果太多，只显示前 30 个。再输细一点。</div>';
  box.innerHTML=html;
  var items=box.querySelectorAll(".item");
  for(var k=0;k<items.length;k++){
    (function(el){
      el.onclick=function(){ openDetail(res[+el.getAttribute("data-i")]); };
    })(items[k]);
  }
}

function esc(s){return String(s==null?"":s).replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;");}

// ---------- 详情 ----------
function openDetail(x){
  cur=x;
  $("searchView").style.display="none";
  $("detailView").style.display="block";
  $("dName").textContent=x.name;
  var meta=[];
  meta.push("商品号 "+x.no);
  if(x.long && x.long!==x.no) meta.push("长编码 "+x.long);
  if(x.spec) meta.push("规格 "+x.spec);
  if(x.zone) meta.push("分区 "+x.zone);
  if(x.price) meta.push("售价 ￥"+x.price);
  $("dMeta").textContent=meta.join(" · ");

  if(x.days){
    var d=parseInt(x.days,10);
    var b=bandOf(d);
    $("dWarn").innerHTML="";
    $("dRule").innerHTML="<b>保质期</b> "+d+" 天　|　<b>档位</b> "+(x.band||b.band)
      +"<br><b>检查频率</b> "+(x.check||b.check)
      +"<br><b>转临期</b> "+((x.pre!==""&&x.pre!=null&&x.pre!=="undefined"&&!isNaN(parseInt(x.pre,10)))?(x.pre+" 天前"):"无（1-29 天档没有临期概念）")
      +"<br><b>下架</b> "+((x.off!==""&&x.off!=null&&x.off!=="undefined"&&!isNaN(parseInt(x.off,10))) ? (parseInt(x.off,10)===0?"届满当天":(x.off+" 天前")) : "—")
      +"<br><br><b>算法</b> 到期日 = 生产/到货日 + 保质期 − 1；转临期日 = 到期日 − 临保提前；下架日 = 到期日 − 下架提前";
  }else{
    $("dRule").innerHTML="<b>这个商品的保质期还没录进主数据。</b><br>请按包装标示为准，或问主管确认。工具不猜天数。";
    $("dWarn").innerHTML='<div class="warn">表里没有保质期，算不了临期日和下架日。</div>';
  }
  $("made").value="";
  $("dResult").innerHTML="";
  window.scrollTo(0,0);
}

$("back").onclick=function(){
  $("detailView").style.display="none";
  $("searchView").style.display="block";
  window.scrollTo(0,0);
};

$("made").onchange=function(){
  if(!cur) return;
  var s=this.value;
  if(!s){ $("dResult").innerHTML=""; return; }
  if(!cur.days){
    $("dResult").innerHTML='<div class="msg">保质期未录，算不了。</div>';
    return;
  }
  var d=parseInt(cur.days,10);
  var b=bandOf(d);
  var pv=parseInt(cur.pre,10), pre=isNaN(pv)?b.pre:pv;
  if(pre===undefined||isNaN(pre)) pre=null;
  var ov=parseInt(cur.off,10), off=isNaN(ov)?b.off:ov;
  if(off===undefined||isNaN(off)) off=0;
  var made=parseDate(s);
  var exp=addDays(made,d-1);
  var offDay=addDays(exp,-off);
  var preDay=(pre===null||pre===undefined)?null:addDays(exp,-pre);
  var t=today();
  var left=daysBetween(t,offDay);

  var html="";
  var cls="s-green", txt="正常";
  if(left<0){ cls="s-red"; txt="已过下架日"; }
  else if(left<=3){ cls="s-orange"; txt="即将下架"; }
  else if(preDay && daysBetween(preDay,t)>=0){ cls="s-orange"; txt="已进临期"; }
  else if(left<=15){ cls="s-gray"; txt="注意"; }
  html+='<div class="status '+cls+'">'+txt+'</div>';
  html+='<ul class="dates">';
  html+='<li><span class="k">生产/到货</span><span class="v">'+fmt(made)+'</span></li>';
  html+='<li><span class="k">到期日</span><span class="v">'+fmt(exp)+'<small>+'+d+'−1</small></span></li>';
  if(preDay){
    html+='<li><span class="k">转临期日</span><span class="v">'+fmt(preDay)+'<small>−'+pre+'</small></span></li>';
  }else{
    html+='<li><span class="k">转临期日</span><span class="v" style="font-weight:400;color:#6b7280">无（1-29 天档）</span></li>';
  }
  html+='<li><span class="k">下架日</span><span class="v">'+fmt(offDay)+'<small>'+((off===0)?"届满当天":("−"+off))+'</small></span></li>';
  html+='<li><span class="k">距下架</span><span class="v">'+(left<0?("已超 "+(-left)+" 天"):(left+" 天"))+'</span></li>';
  html+='</ul>';
  if(left<0) html+='<div class="msg">已经过下架日了，按报损流程处理。</div>';
  else if(left<=3) html+='<div class="msg">'+left+' 天内要下架，先按打折阶梯处理。</div>';
  $("dResult").innerHTML=html;
};

// ---------- 结果计数（手机版附加，不改查商品逻辑） ----------
function updateCount(q){
  var el=$("count"), card=$("resultCard");
  if(!norm(q)){ el.textContent=""; card.style.display="none"; return; }
  card.style.display="block";
  var n=search(q).length;
  el.textContent = n ? ("找到 "+n+" 个商品"+(n>30?"，先显示前 30 个":"")) : "";
}

// ---------- 输入（120ms 防抖） ----------
var t=null;
var qInput=$("q");
qInput.addEventListener("input",function(){
  var v=this.value;
  $("clr").className = v ? "clr show" : "clr";
  clearTimeout(t);
  t=setTimeout(function(){ render(v); updateCount(v); },120);
});
$("clr").onclick=function(){
  qInput.value="";
  this.className="clr";
  render(""); updateCount("");
  qInput.focus();
};
</script>
</body>
</html>
